<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>초성퀴즈</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f7f8ff;font-family:Arial,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 15% 10%,#5144aa55,transparent 30%),radial-gradient(circle at 85% 15%,#22bbaa33,transparent 28%),linear-gradient(145deg,#080b16,#121a31)}
.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#8b7cff,#5747e8);font-weight:900;font-size:22px}.brand h1{margin:0;font-size:20px}.brand p{margin:3px 0;color:#aab4d0;font-size:11px}.status{padding:8px 12px;border:1px solid #ffffff18;border-radius:99px;color:#aab4d0;font-size:12px}.ok{color:#7ee9da!important;border-color:#38d9c855!important}
.hero,.panel{border:1px solid #ffffff12;border-radius:24px;background:#131b34dd;box-shadow:0 25px 70px #0004}.hero{padding:38px 40px;margin-bottom:16px;overflow:hidden}.hero h2{font-size:clamp(36px,6vw,64px);line-height:1.05;letter-spacing:-3px;margin:10px 0 14px}.hero p{color:#aab4d0;line-height:1.7;margin:0}.eyebrow{font-size:12px;color:#a096ff;font-weight:800;letter-spacing:1.5px}.panel{padding:21px;margin-bottom:16px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}label{display:block;color:#aab4d0;font-size:12px;margin:0 0 6px 3px}select,input{width:100%;height:48px;border:1px solid #ffffff12;border-radius:12px;background:#10172a;color:#fff;padding:0 13px;outline:0}.btn{height:48px;border:0;border-radius:12px;padding:0 20px;color:white;font-weight:800;background:linear-gradient(135deg,#8b7cff,#5949e8);cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#202a48}.green{background:linear-gradient(135deg,#28cdbb,#15998c)}
.quiz,.result{display:none}.show{display:block}.quizTop{display:flex;justify-content:space-between}.badge{font-size:11px;padding:6px 10px;border-radius:99px;background:#202a48;border:1px solid #ffffff12;color:#cbd2e8;margin-right:5px}.progress{height:6px;background:#1a2440;border-radius:99px;overflow:hidden;margin:15px 0 25px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b7cff,#38d9c8)}.questionBox{text-align:center;padding:25px 10px}.questionLabel{color:#aab4d0;font-size:13px}.question{font-size:clamp(46px,9vw,88px);font-weight:900;letter-spacing:8px;margin:14px 0;text-shadow:0 8px 35px #8978ff33}.hint{min-height:25px;color:#c8cee0;font-size:14px}.answerArea{max-width:650px;margin:auto}.answerRow{display:flex;gap:9px}.answerRow input{height:55px;text-align:center;font-size:18px}.answerRow .btn{height:55px;min-width:110px}.message{text-align:center;min-height:25px;margin:12px 0;font-weight:800}.good{color:#71ead7}.bad{color:#ff8fa9}.nextRow{display:flex;justify-content:center;gap:8px}.result{text-align:center;padding:45px 20px}.score{font-size:72px;font-weight:900}.result p{color:#aab4d0}.empty{text-align:center;color:#aab4d0;padding:45px}.footer{text-align:center;color:#66718e;font-size:11px;margin-top:18px}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.start{grid-column:1/-1}.hero{padding:30px 24px}}@media(max-width:500px){.controls{grid-template-columns:1fr}.start{grid-column:auto}.answerRow{flex-direction:column}.answerRow .btn{width:100%}.nextRow{flex-wrap:wrap}.status{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">Q</div><div><h1>초성퀴즈</h1><p>FIREBASE QUIZ BANK</p></div></div><div id="status" class="status">문제은행 연결 중...</div></header>
<section class="hero"><div class="eyebrow">INITIAL QUIZ</div><h2>초성만 보고<br>정답을 맞혀보세요.</h2><p>Firebase <b>/quizBank</b>의 문제를 자동으로 불러옵니다.<br>문제를 추가하면 게임을 수정하지 않아도 새로운 문제가 출제됩니다.</p></section>
<section class="panel" id="setup"><div class="controls">
<div><label>카테고리</label><select id="category"><option value="all">전체</option></select></div>
<div><label>난이도</label><select id="difficulty"><option value="all">전체</option><option value="1">쉬움</option><option value="2">보통</option><option value="3">어려움</option></select></div>
<div><label>문제 수</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
<button id="start" class="btn start" disabled>게임 시작</button></div></section>
<section class="panel quiz" id="quiz">
<div class="quizTop"><div><span class="badge" id="cat">영화</span><span class="badge" id="diff">보통</span></div><span class="badge" id="num">1 / 10</span></div>
<div class="progress"><i id="bar"></i></div><div class="questionBox"><div class="questionLabel">이 초성의 정답은?</div><div class="question" id="q">ㄱㅎㅈㅇ</div><div class="hint" id="hint"></div></div>
<div class="answerArea"><div class="answerRow"><input id="answer" autocomplete="off" placeholder="정답을 입력하세요"><button id="submit" class="btn">정답 확인</button></div><div id="msg" class="message"></div><div class="nextRow"><button id="hintBtn" class="btn secondary">힌트 보기</button><button id="skip" class="btn secondary">문제 넘기기</button><button id="next" class="btn green" style="display:none">다음 문제</button></div></div>
</section>
<section class="panel result" id="result"><div class="eyebrow">QUIZ COMPLETE</div><div class="score" id="score">0 / 10</div><p id="resultText"></p><button id="again" class="btn">다시 하기</button></section>
<div id="empty" class="empty" style="display:none"></div><div class="footer">Quiz Bank · /quizBank · active=true 문제만 출제</div>
</div>
<script>
const BASE="https://andy-5cb5e-default-rtdb.firebaseio.com";
let bank=[],game=[],idx=0,score=0,answered=false;
const $=x=>document.getElementById(x),norm=x=>String(x??"").trim().replace(/\s+/g,"").toLowerCase();
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function load(){try{let r=await fetch(BASE+"/quizBank.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;let d=await r.json();bank=Object.entries(d||{}).map(([id,q])=>({id,...q})).filter(q=>q.active!==false&&q.type==="초성퀴즈"&&q.question&&q.answer);let cs=[...new Set(bank.map(q=>q.category).filter(Boolean))].sort();$("category").innerHTML='<option value="all">전체</option>'+cs.map(c=>'<option>'+c+'</option>').join("");$("status").textContent="문제은행 연결됨 · "+bank.length+"문제";$("status").classList.add("ok");$("start").disabled=!bank.length}catch(e){$("status").textContent="문제은행 연결 실패";$("empty").style.display="block";$("empty").textContent="Firebase /quizBank를 불러오지 못했습니다."}}
function start(){let c=$("category").value,d=$("difficulty").value,n=+$("count").value;let f=bank.filter(x=>(c==="all"||x.category===c)&&(d==="all"||String(x.difficulty)===d));if(!f.length)return alert("선택한 조건의 문제가 없습니다.");game=shuffle(f).slice(0,n);idx=0;score=0;$("setup").style.display="none";$("result").classList.remove("show");$("quiz").classList.add("show");show()}
function show(){let x=game[idx];answered=false;$("cat").textContent=x.category||"퀴즈";$("diff").textContent=({1:"쉬움",2:"보통",3:"어려움"})[x.difficulty]||"난이도";$("num").textContent=(idx+1)+" / "+game.length;$("bar").style.width=(idx/game.length*100)+"%";$("q").textContent=x.question;$("hint").textContent="";$("msg").textContent="";$("msg").className="message";$("answer").value="";$("answer").disabled=false;$("submit").disabled=false;$("hintBtn").disabled=false;$("skip").style.display="";$("next").style.display="none";setTimeout(()=>$("answer").focus(),30)}
function reveal(ok){let x=game[idx];answered=true;$("msg").textContent=ok?"정답입니다! 🎉":"아쉬워요! 정답은 「"+x.answer+"」입니다.";$("msg").className="message "+(ok?"good":"bad");$("answer").disabled=true;$("submit").disabled=true;$("hintBtn").disabled=true;$("skip").style.display="none";$("next").style.display="";$("bar").style.width=((idx+1)/game.length*100)+"%"}
$("start").onclick=start;$("hintBtn").onclick=()=>{$("hint").textContent=game[idx].hint?"힌트 · "+game[idx].hint:"힌트가 없습니다.";$("hintBtn").disabled=true};$("submit").onclick=()=>{if(answered)return;let v=$("answer").value;if(!v.trim()){$("msg").textContent="정답을 입력해주세요.";$("msg").className="message bad";return}let ok=norm(v)===norm(game[idx].answer);if(ok)score++;reveal(ok)};$("skip").onclick=()=>{if(!answered)reveal(false)};$("next").onclick=()=>{idx++;idx>=game.length?finish():show()};$("again").onclick=()=>{$("result").classList.remove("show");$("setup").style.display=""};$("answer").onkeydown=e=>{if(e.key==="Enter")$("submit").click()};
function finish(){$("quiz").classList.remove("show");$("result").classList.add("show");$("score").textContent=score+" / "+game.length;let p=Math.round(score/game.length*100);$("resultText").textContent=p===100?"완벽합니다! 초성퀴즈 마스터네요.":p>=80?"아주 잘했어요! 조금만 더 하면 만점입니다.":p>=60?"좋아요! 한 번 더 도전해보세요.":"괜찮아요. 한 번 더 풀어보세요."}
load();
</script>
</body>
</html>
